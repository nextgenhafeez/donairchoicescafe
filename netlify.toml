# Netlify hosting config for donairchoicescafe.ca
[build]
  publish = "."
  command = ""

# Force HTTPS + www → apex (Netlify also does this in Domain settings)
[[redirects]]
  from = "https://www.donairchoicescafe.ca/*"
  to = "https://donairchoicescafe.ca/:splat"
  status = 301
  force = true

# Nice-to-have security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
