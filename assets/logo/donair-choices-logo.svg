<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" width="660" height="400" role="img" aria-label="Donair Choices Cafe logo">
  <title>Donair Choices Cafe</title>
  <defs>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4f8fb"/><stop offset="45%" stop-color="#dce6ed"/>
      <stop offset="52%" stop-color="#ffffff"/><stop offset="60%" stop-color="#d0dce5"/>
      <stop offset="100%" stop-color="#aebecb"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e21f2c"/><stop offset="55%" stop-color="#c8102e"/><stop offset="100%" stop-color="#9a0c20"/>
    </linearGradient>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.2" flood-color="#0a141d" flood-opacity="0.55"/>
    </filter>
  </defs>
  <path filter="url(#soft)" fill="url(#red)" d="M76 120 C204 40 406 36 586 96 L600 132 C450 104 230 92 76 120 Z"/>
  <path filter="url(#soft)" fill="url(#red)" transform="rotate(180 332 200)" d="M76 120 C204 40 406 36 586 96 L600 132 C450 104 230 92 76 120 Z"/>
  <g filter="url(#soft)" fill="url(#chrome)" stroke="#37485a" stroke-width="0.6" stroke-linejoin="round">
    <text x="332" y="150" text-anchor="middle" font-family="'Poppins','Arial Black',sans-serif" font-weight="800" font-size="40" letter-spacing="9">DONAIR</text>
    <text x="332" y="278" text-anchor="middle" font-family="'Poppins','Arial Black',sans-serif" font-weight="800" font-size="46" letter-spacing="12">CAFE</text>
  </g>
  <text filter="url(#soft)" x="332" y="232" text-anchor="middle" font-family="'Kaushan Script','Brush Script MT',cursive"
        font-size="98" font-style="italic" paint-order="stroke" stroke="#cbd7e0" stroke-width="3.2" stroke-linejoin="round"
        fill="url(#chrome)">Choices</text>
</svg>
